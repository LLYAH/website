<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart · Love &amp; Love YAH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&amp;family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Anton&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Yeseva+One&amp;family=Epilogue:wght@400;500;600;700;800&amp;family=Caveat:wght@500;700&amp;family=Fredoka:wght@500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  .crf{display:block}
  .cr-row{display:grid;grid-template-columns:88px 1fr auto auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid rgba(43,35,32,.1)}
  .cr-qty{display:inline-flex;align-items:center;border:1px solid rgba(0,0,0,.14);border-radius:9px;overflow:hidden}
  .cr-qty button{width:32px;height:32px;border:none;background:#fff;font:inherit;font-size:16px;cursor:pointer;color:#1A1917}
  .cr-qty input{width:38px;text-align:center;border:none;border-left:1px solid rgba(0,0,0,.1);border-right:1px solid rgba(0,0,0,.1);font:inherit;font-size:14px;padding:6px 0}
  .cr-remove{border:none;background:none;color:#8a7a6a;font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
  @media(max-width:900px){.cart-grid{grid-template-columns:1fr!important}.cart-side{position:static!important}}
  @media(max-width:560px){.cr-row{grid-template-columns:60px 1fr;grid-template-rows:auto auto}.cr-row .cr-qty{grid-column:1/2}.cr-row .cr-linetotal{grid-column:2/3;text-align:right}}
</style>
</head><body>
<site-nav base=""></site-nav>
<div class="crf"><div style="background:#fff;color:#1A1917;font-family:'Hanken Grotesk',sans-serif;min-height:100vh">
  <div style="max-width:1180px;margin:0 auto;padding:56px 24px 90px">
    <div style="font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#185ABD">Your cart</div>
    <h1 style="font-weight:800;font-size:42px;letter-spacing:-1.6px;line-height:1.02;margin:14px 0 30px">Shopping Cart</h1>

    <div id="cr-empty" style="display:none;padding:60px 0;text-align:center;border:1px dashed rgba(0,0,0,.16);border-radius:16px">
      <p style="font-size:17px;color:#5a4f49;margin:0 0 18px">Your cart is empty.</p>
      <a class="plain" href="woodworking.html" style="display:inline-flex;background:#41A5EE;color:#fff;font-weight:700;font-size:15px;padding:13px 26px;border-radius:11px">Start shopping</a>
    </div>

    <div id="cr-filled" class="cart-grid" style="display:grid;grid-template-columns:1fr 340px;gap:44px;align-items:start">
      <div>
        <div id="cr-items"></div>

        <div style="margin-top:28px;padding:20px;border:1px solid rgba(0,0,0,.1);border-radius:14px">
          <div style="font-size:13px;font-weight:700;margin-bottom:10px">Coupon code</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input id="cr-coupon-input" placeholder="Enter code" style="flex:1;min-width:160px;padding:11px 14px;border:1px solid rgba(0,0,0,.14);border-radius:9px;font:inherit;font-size:14px">
            <button onclick="crApplyCoupon()" style="background:#1A1917;color:#fff;border:none;font:inherit;font-weight:700;font-size:14px;padding:11px 20px;border-radius:9px;cursor:pointer">Apply</button>
          </div>
          <div id="cr-coupon-msg" style="font-size:13px;margin-top:8px"></div>
        </div>

        <div style="margin-top:28px;padding:20px;border:1px solid rgba(0,0,0,.1);border-radius:14px">
          <div style="font-size:13px;font-weight:700;margin-bottom:10px">Estimate shipping</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
            <select id="cr-ship-state" style="padding:11px 12px;border:1px solid rgba(0,0,0,.14);border-radius:9px;font:inherit;font-size:14px;background:#fff">
              <option value="">State</option><option>AL</option><option>AK</option><option>AZ</option><option>AR</option><option>CA</option><option>CO</option><option>CT</option><option>FL</option><option>GA</option><option>HI</option><option>IL</option><option>NY</option><option>TX</option><option>WA</option><option>Other</option>
            </select>
            <input id="cr-ship-zip" placeholder="ZIP code" style="padding:11px 14px;border:1px solid rgba(0,0,0,.14);border-radius:9px;font:inherit;font-size:14px">
          </div>
          <button onclick="crEstimateShipping()" style="width:100%;background:#fff;color:#1A1917;border:1px solid rgba(0,0,0,.16);font:inherit;font-weight:700;font-size:14px;padding:11px 0;border-radius:9px;cursor:pointer">Estimate</button>
          <div id="cr-ship-msg" style="font-size:13px;color:#5a4f49;margin-top:8px"></div>
        </div>

        <div id="cr-crosssell" style="margin-top:40px"></div>
      </div>

      <div class="cart-side" style="position:sticky;top:100px;border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:26px;box-shadow:0 16px 44px rgba(0,0,0,.06)">
        <div style="font-weight:800;font-size:19px;letter-spacing:-.3px;margin-bottom:18px">Order summary</div>
        <div style="display:flex;justify-content:space-between;font-size:15px;color:#5a4f49;margin-bottom:10px"><span>Subtotal</span><span id="cr-subtotal">$0.00</span></div>
        <div id="cr-discount-row" style="display:none;justify-content:space-between;font-size:15px;color:#1a7d4a;margin-bottom:10px"><span id="cr-discount-label">Discount</span><span id="cr-discount">−$0.00</span></div>
        <div style="display:flex;justify-content:space-between;font-size:15px;color:#5a4f49;margin-bottom:10px"><span>Shipping</span><span id="cr-shipping">Calculated below</span></div>
        <div style="display:flex;justify-content:space-between;font-size:15px;color:#5a4f49;margin-bottom:16px"><span>Estimated tax</span><span id="cr-tax">$0.00</span></div>
        <div style="border-top:1px solid rgba(43,35,32,.14);padding-top:16px;display:flex;justify-content:space-between;font-size:19px;font-weight:800;margin-bottom:20px"><span>Total</span><span id="cr-total">$0.00</span></div>
        <a id="cr-checkout-btn" class="plain" href="checkout.html" style="display:flex;align-items:center;justify-content:center;width:100%;background:#41A5EE;color:#fff;font-weight:700;font-size:16px;padding:14px 0;border-radius:12px">Proceed to checkout</a>
        <div style="text-align:center;font-size:12px;color:#8a7a6a;margin-top:12px">10% of every purchase is donated automatically.</div>
      </div>
    </div>
  </div>
</div></div>
<site-footer base=""></site-footer>
<script src="site-chrome.js"></script>
<script src="site.js"></script>
<script src="cart.js"></script>
<script>
var crCoupon = null;
var crShipping = null;

function money(n) { return "$" + n.toFixed(2); }

function crRenderItems() {
  const cart = LLYCart.getCart();
  const wrap = document.getElementById("cr-items");
  document.getElementById("cr-empty").style.display = cart.length ? "none" : "block";
  document.getElementById("cr-filled").style.display = cart.length ? "grid" : "none";
  wrap.innerHTML = cart.map((it) => (
    '<div class="cr-row">' +
      '<div style="width:88px;height:88px;border-radius:10px;background:' + it.color + '"></div>' +
      '<div><div style="font-weight:700;font-size:15px">' + it.name + '</div><div style="font-size:13px;color:#8a7a6a;margin-top:2px">' + it.category + '</div><button class="cr-remove" onclick="crRemove(\'' + it.id + '\')">Remove</button></div>' +
      '<div class="cr-qty"><button onclick="crChangeQty(\'' + it.id + '\',' + (it.qty - 1) + ')">−</button><input value="' + it.qty + '" oninput="crChangeQty(\'' + it.id + '\', parseInt(this.value||1,10))"><button onclick="crChangeQty(\'' + it.id + '\',' + (it.qty + 1) + ')">+</button></div>' +
      '<div class="cr-linetotal" style="font-weight:700;font-size:15px;min-width:70px;text-align:right">' + money(it.price * it.qty) + '</div>' +
    '</div>'
  )).join("");
}

function crRenderCrossSell() {
  const cart = LLYCart.getCart();
  const cartIds = cart.map((i) => i.id);
  const pool = LLYCart.CATALOG.filter((p) => !cartIds.includes(p.id));
  const picks = pool.slice(0, 4);
  const wrap = document.getElementById("cr-crosssell");
  if (!picks.length) { wrap.innerHTML = ""; return; }
  wrap.innerHTML =
    '<div style="font-weight:800;font-size:18px;letter-spacing:-.3px;margin-bottom:14px">You may also like</div>' +
    '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">' +
    picks.map((p) => (
      '<div>' +
        '<a class="plain" href="' + p.href + '"><div style="aspect-ratio:4/5;border-radius:12px;background:' + p.color + '"></div></a>' +
        '<div style="font-size:14px;font-weight:700;margin-top:8px">' + p.name + '</div>' +
        '<div style="font-size:13px;color:#8a7a6a;margin-bottom:8px">' + money(p.price) + '</div>' +
        '<button onclick=\'LLYCart.addToCart(' + JSON.stringify({ id: p.id, name: p.name, price: p.price, color: p.color, category: p.category }) + ');crRefreshAll()\' style="width:100%;background:#fff;color:#1A1917;border:1px solid rgba(0,0,0,.16);font:inherit;font-weight:700;font-size:13px;padding:9px 0;border-radius:9px;cursor:pointer">Add to cart</button>' +
      '</div>'
    )).join("") +
    '</div>';
}

function crChangeQty(id, qty) { LLYCart.updateQty(id, Math.max(0, qty)); crRefreshAll(); }
function crRemove(id) { LLYCart.removeItem(id); crRefreshAll(); }

function crApplyCoupon() {
  const val = document.getElementById("cr-coupon-input").value;
  const c = LLYCart.applyCoupon(val);
  const msg = document.getElementById("cr-coupon-msg");
  if (!c) { crCoupon = null; msg.style.color = "#c0392b"; msg.textContent = val ? "Coupon not recognized." : ""; }
  else { crCoupon = c; msg.style.color = "#1a7d4a"; msg.textContent = "Applied: " + c.label + "."; }
  crRenderTotals();
}

function crEstimateShipping() {
  const state = document.getElementById("cr-ship-state").value;
  const zip = document.getElementById("cr-ship-zip").value;
  const msg = document.getElementById("cr-ship-msg");
  if (!state && !zip) { msg.textContent = "Enter a state or ZIP to estimate."; crShipping = null; crRenderTotals(); return; }
  const subtotal = LLYCart.cartSubtotal();
  let rate = subtotal >= 75 ? 0 : 6.95;
  if (state === "AK" || state === "HI") rate += 12;
  crShipping = rate;
  msg.textContent = rate === 0 ? "Free shipping — your order qualifies." : "Estimated shipping: " + money(rate) + (state ? " to " + state : "") + ".";
  crRenderTotals();
}

function crRenderTotals() {
  const subtotal = LLYCart.cartSubtotal();
  document.getElementById("cr-subtotal").textContent = money(subtotal);
  let discount = 0;
  const discRow = document.getElementById("cr-discount-row");
  if (crCoupon) {
    discount = crCoupon.pct ? subtotal * (crCoupon.pct / 100) : crCoupon.flat;
    discount = Math.min(discount, subtotal);
    discRow.style.display = "flex";
    document.getElementById("cr-discount-label").textContent = "Discount (" + crCoupon.label + ")";
    document.getElementById("cr-discount").textContent = "−" + money(discount);
  } else { discRow.style.display = "none"; }
  const afterDiscount = subtotal - discount;
  document.getElementById("cr-shipping").textContent = crShipping === null ? "Calculated below" : (crShipping === 0 ? "Free" : money(crShipping));
  const tax = afterDiscount * 0.07;
  document.getElementById("cr-tax").textContent = money(tax);
  const total = afterDiscount + tax + (crShipping || 0);
  document.getElementById("cr-total").textContent = money(total);
}

function crRefreshAll() { crRenderItems(); crRenderCrossSell(); crRenderTotals(); }
document.addEventListener("DOMContentLoaded", crRefreshAll);
document.addEventListener("cart:change", crRefreshAll);
</script>
</body></html>
