<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Love &amp; Love YAH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&amp;family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Anton&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Yeseva+One&amp;family=Epilogue:wght@400;500;600;700;800&amp;family=Caveat:wght@500;700&amp;family=Fredoka:wght@500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head><body>
<site-nav base=""></site-nav>
<div style="background:#fff;color:#1A1917;font-family:'Hanken Grotesk',sans-serif;min-height:100vh">
<div style="max-width:980px;margin:0 auto;padding:70px 24px 64px">
  <div style="font-size:14px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#185ABD">We'd love to hear from you<svg viewBox="0 0 24 24" width="14" height="14" fill="#185ABD" style="display:inline-block;vertical-align:-2px;margin-left:8px"><path d="M12 21s-7.5-4.6-9.3-9C1.4 8.6 3.2 5.5 6.3 5.1c2-.3 3.7.7 4.7 2.2h2c1-1.5 2.7-2.5 4.7-2.2 3.1.4 4.9 3.5 3.6 6.9C19.5 16.4 12 21 12 21z"></path></svg></div>
  <h1 style="font-weight:800;font-size:52px;letter-spacing:-2px;line-height:1;margin:16px 0 12px">Get in touch.</h1>
  <p style="font-size:17px;line-height:1.6;color:#5a4f49;max-width:520px;margin:0 0 42px">Questions about donations and Give-back, questions about an order, our Free resources, website, graphic design or marketing services for your ministry or church, partnership opportunities, or anything else.</p>
  <div class="ct-grid" style="display:grid;grid-template-columns:1.3fr 1fr;gap:44px">
    <form id="ct-form" style="display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:18px;padding:34px;box-shadow:0 1px 3px rgba(0,0,0,.10),0 4px 11px rgba(26,25,23,.07)">
      <input id="ct-name" required placeholder="Your name" style="width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid rgba(0,0,0,.14);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:#1A1917">
      <input id="ct-email" type="email" required placeholder="Email address" style="width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid rgba(0,0,0,.14);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:#1A1917">
      <div>
        <label style="display:block;font-size:12px;font-weight:700;color:#5a4f49;margin-bottom:6px">What are you contacting us about?</label>
        <select id="ct-topic" style="width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid rgba(0,0,0,.14);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:#1A1917">
          <option>Merch and Products</option>
          <option>Give-back and donation</option>
          <option>Daily Bread</option>
          <option>Radio / Music</option>
          <option>Free Resources</option>
          <option>Create custom graphics for your church or ministry</option>
          <option>Partnership or work with us</option>
          <option>Marketing</option>
          <option>Newsletter and Emails</option>
          <option>Testimonies</option>
          <option>Other</option>
        </select>
      </div>
      <textarea id="ct-msg" required placeholder="Your message" rows="6" style="width:100%;box-sizing:border-box;padding:13px 15px;border:1px solid rgba(0,0,0,.14);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:#1A1917;resize:vertical"></textarea>
      <button type="submit" style="align-self:flex-start;background:#41A5EE;color:#fff;border:none;font:inherit;font-weight:700;font-size:15px;padding:14px 30px;border-radius:12px;cursor:pointer">Send message</button>
      <div id="ct-note" style="font-size:13px;line-height:1.5;color:#5a4f49"></div>
    </form>
    <div style="display:flex;flex-direction:column;gap:26px"></div>
  </div>
</div>
</div>
<site-footer base=""></site-footer>
<script src="site-chrome.js?v=5"></script>
<script src="site.js"></script>
<script>
(function(){
  // Web3Forms: create a free access key at web3forms.com with hello@loveandloveyah.com,
  // then paste it below. Messages then send from the site straight to that inbox.
  var ACCESS_KEY = 'YOUR-WEB3FORMS-ACCESS-KEY';
  var f = document.getElementById('ct-form');
  if(!f) return;
  var note = document.getElementById('ct-note');
  var btn = f.querySelector('button[type=submit]');
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var payload = {
      access_key: ACCESS_KEY,
      subject: '[' + document.getElementById('ct-topic').value + '] Message from ' + document.getElementById('ct-name').value.trim(),
      from_name: 'Love and Love YAH website',
      name: document.getElementById('ct-name').value.trim(),
      email: document.getElementById('ct-email').value.trim(),
      topic: document.getElementById('ct-topic').value,
      message: document.getElementById('ct-msg').value.trim()
    };
    btn.disabled = true; btn.textContent = 'Sending\u2026';
    note.style.color = '#5a4f49'; note.textContent = '';
    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: {'Content-Type':'application/json', Accept:'application/json'},
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d.success){
        f.reset();
        btn.textContent = 'Send message';
        note.style.color = '#185ABD';
        note.textContent = 'Thank you \u2014 your message is on its way. We read every note.';
      } else { throw new Error(d.message || 'failed'); }
    }).catch(function(){
      btn.textContent = 'Send message';
      note.style.color = '#a33';
      note.innerHTML = 'Something went wrong sending that. Please try again or email <a href="mailto:hello@loveandloveyah.com">hello@loveandloveyah.com</a>.';
    }).then(function(){ btn.disabled = false; });
  });
})();
</script>
</body></html>
