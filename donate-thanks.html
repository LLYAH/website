<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · Love &amp; Love YAH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head><body>
<site-nav base=""></site-nav>
<div style="background:#fff;color:#1A1917;font-family:'Hanken Grotesk',sans-serif;min-height:100vh">
<div style="max-width:620px;margin:0 auto;padding:70px 24px 64px;text-align:center">
  <div style="font-size:14px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#185ABD">Gift received</div>
  <h1 style="font-weight:800;font-size:52px;letter-spacing:-2px;line-height:1;margin:16px 0 12px">Thank you.</h1>
  <p id="dt-lede" style="font-size:17px;line-height:1.6;color:#5a4f49;margin:0 auto 34px;max-width:480px">Confirming your donation…</p>
  <div style="background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:30px;text-align:left;box-shadow:0 20px 50px rgba(0,0,0,.14)">
    <div id="dt-status" style="font-size:15px;line-height:1.6;color:#1A1917">Checking with the payment processor…</div>
    <div id="dt-ref" style="display:none;font-size:12.5px;color:#8a7a6a;margin-top:12px"></div>
    <div style="display:flex;gap:10px;margin-top:22px">
      <a class="plain" href="give-back" style="flex:1;text-align:center;background:#41A5EE;color:#fff;font-weight:700;font-size:15px;padding:14px 0;border-radius:12px">See the give-back</a>
      <a class="plain" href="index" style="flex:1;text-align:center;background:#fff;color:#1A1917;border:1px solid rgba(0,0,0,.14);font-weight:700;font-size:15px;padding:14px 0;border-radius:12px">Back to the shop</a>
    </div>
  </div>
  <p style="font-size:13px;color:#8a7a6a;margin:26px auto 0;max-width:460px">A receipt is on its way to your email. Keep it for your tax records.</p>
</div></div>
<site-footer base=""></site-footer>
<script src="site-chrome.js?v=2"></script>
<script>
var q = new URLSearchParams(location.search);
var lede = document.getElementById("dt-lede");
var status = document.getElementById("dt-status");
var refEl = document.getElementById("dt-ref");

function done(msg, ref) {
  lede.textContent = "100% of your gift goes straight to our partners — clean water, youth ministry, meals, mental-health support, and the arts.";
  status.textContent = msg;
  if (ref) { refEl.textContent = "Reference: " + ref; refEl.style.display = "block"; }
}
function problem(msg) {
  lede.textContent = "We hit a snag confirming this one.";
  status.textContent = msg;
}
function money(cents) { return "$" + (cents / 100).toFixed(2); }

(async function () {
  var gateway = q.get("gateway");

  if (gateway === "stripe") {
    done("Your donation is confirmed. Stripe has your receipt and we've logged the gift.", q.get("session_id"));
    return;
  }

  if (gateway === "paypal") {
    var token = q.get("token");
    var subId = q.get("subscription_id");
    if (!token && !subId) { done("Your donation is confirmed."); return; }
    try {
      var r = await fetch("/api/donate-paypal?action=capture", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(subId ? { subscription_id: subId } : { token: token })
      });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(d.error || "PayPal couldn't confirm this payment.");
      var amt = d.amount_cents ? " of " + money(d.amount_cents) : "";
      done(subId
        ? "Your monthly gift" + amt + " is active. PayPal will bill it each month until you cancel."
        : "Your donation" + amt + " is confirmed. We've logged the gift and emailed your receipt.",
        subId || token);
    } catch (e) {
      problem(e.message + " If PayPal showed you a completed payment, it went through — email giving@loveandloveyah.com and we'll sort the receipt.");
    }
    return;
  }

  done("Your donation is confirmed.");
})();
</script>
</body></html>
